<script>
(()=>{
const root=document.getElementById('ck-design'),stage=root.querySelector('#ck-stage');
const s={mode:'learner',screen:'home',category:'すべて',quiet:false,level:'やさしい',voice:0,reply:'repair',hint:0,saved:false,assigned:false,admin:'overview',person:'A',published:false,report:false};
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(label,action,kind='secondary',extra='')=>`<button type="button" class="ck-${kind} cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
const status=()=>'<div class="ck-status"><span>9:41</span><span>●●●　Wi-Fi　▰</span></div>';
const titlebar=(label,back='home')=>`<div class="ck-appbar">${button(icon('chevron-left'),back,'icon',`aria-label="戻る"`)}<div class="ck-head-title">${label}</div>${button(icon('circle-help'),'help','icon',`aria-label="ヒントを表示"`)}</div>`;
const nav=active=>`<nav class="ck-bottom" aria-label="学習メニュー">${[['home','house','ホーム'],['library','layers','場面'],['phrases','bookmark','ことば'],['review','history','ふりかえり']].map(([a,i,t])=>`<button class="cursor-interaction ${active===a?'ck-active':''}" type="button" data-action="${a}">${icon(i)}<span>${t}</span></button>`).join('')}</nav>`;
const phone=(body,active,voice=false)=>`<section class="ck-phone ${voice?'ck-voice':''}" aria-label="学習者の画面">${status()}${body}${active?nav(active):''}</section>`;
const sceneList=[['入浴','入浴を断られたとき','本人の気持ちを確かめる','bath'],['排泄','小さな声のお願い','聞き取れない言葉を確認する','ear'],['食事','「あとで」の意味を確かめる','希望の時間をたずねる','utensils'],['申し送り','先輩に短く、正確に伝える','分かっていること・まだ不明なこと','clipboard-list'],['指示確認','「あっちを先に」と言われたら','場所と順番を確認する','messages-square'],['移乗','始める前の声かけ','これからすることを短く伝える','handshake']];
function home(){return phone(`<div class="ck-appbar"><div class="ck-wordmark">Care Kotoba</div>${button(icon('user-round'),'account','icon','aria-label="アカウントとプラン"')}</div><div class="ck-body"><div class="ck-eyebrow">MY NEXT CONVERSATION</div><h1 class="ck-home-title">次の声かけを、<br>ここで。</h1><p class="ck-soft">休んでも、続きから。今日は何分できますか。</p><div class="ck-time-toggle"><button type="button" class="ck-selected cursor-interaction" data-action="start">90秒だけ</button>${button(s.quiet?'声を出せない日 ✓':'声を出せない日','quiet','link')}</div><article class="ck-scene-card"><div class="ck-row"><span class="ck-tag">今日の練習 · 入浴</span><span class="ck-soft">90秒</span></div><h2>「今はいい」の、<br>その先へ。</h2><p class="ck-soft">急がせずに、本人の気持ちを確かめる。</p><div class="ck-scene-quote">「今はいいです。」</div>${button((s.quiet?'文字で、やってみる':'90秒、練習する')+icon('arrow-right'),'start','primary')}</article><div class="ck-row"><h2 class="ck-section-title">前回の一言を、もう一度</h2>${button('すべて','review','link')}</div><button type="button" class="ck-small-task cursor-interaction" data-action="retry"><span class="ck-task-icon">${icon('rotate-ccw')}</span><span class="ck-task-copy"><strong>聞き返すのは、できている。</strong><small>次は「何を」確認するかも伝えよう。</small></span>${icon('chevron-right')}</button><h2 class="ck-section-title">今週の3つ</h2><div class="ck-label-line"><span>聞き返す</span><span>・</span><span>言い直す</span><span>・</span><span>申し送る</span></div><div class="ck-progress-line" aria-label="例：今週3課題のうち1課題を練習"><span style="width:33%"></span></div></div>`,'home');}
function brief(){return phone(titlebar('場面を確認')+`<div class="ck-body"><span class="ck-tag">入浴 · 希望を確かめる</span><h1 class="ck-title">入浴を<br>断られたとき。</h1><div class="ck-scene-quote">「今はいいです。」</div><ul class="ck-detail-list"><li><span>場面</span>入浴の声かけに、本人が気の進まない様子です。</li><li><span>今回の目標</span>本人の希望をたずね、必要なことを先輩に伝える。</li><li><span>まだ分からないこと</span>今は入りたくない理由。推測せず、会話で確かめます。</li></ul><div class="ck-row"><span class="ck-soft">ことばの難しさ</span>${button(s.level+' '+icon('chevron-down'),'level','link')}</div><div class="ck-note">${s.hint?'今回のヒント：相手の言葉を受け止め、まだ分からないことを一つたずねます。':'見本を覚えるより、自分の言葉で一度やってみましょう。'}</div>${button((s.quiet?'文字で始める':'会話を始める')+icon('arrow-right'),'begin','primary')}${button('場面一覧を見る','library','link')}</div>`,null);}
function voice(){const replies={repair:['今日は入りたくないのですね。何か気になることはありますか。','寒いから、今日はやめたいの。'],push:['お風呂の時間です。行きましょう。','でも、今日は入りたくないんです。'],ask:['すみません。「今は」というのは、あとならよいですか。','今日は寒いので、やめておきたいです。']};const rr=replies[s.reply];return phone(titlebar('入浴を断られたとき','start')+`<div class="ck-body"><div class="ck-steps"><span class="ck-step ck-on">聞く</span><span class="ck-step ${s.voice?'ck-on':''}">確かめる</span><span class="ck-step">つなぐ</span></div><div class="ck-eyebrow">ご本人のことば</div><div class="ck-bubble">${s.voice?rr[1]:'今はいいです。'}</div><div class="ck-orb" aria-hidden="true">${[18,34,56,32,73,48,27,50,29].map(h=>`<span style="height:${h}px"></span>`).join('')}</div><div class="ck-voice-label">${s.voice?'相手の気持ちが、少し見えました':'あなたの番です'}</div>${s.voice?`<div class="ck-transcript"><span class="ck-eyebrow">あなたの発話 · 操作例</span><p>${rr[0]}</p></div>${button('この会話を振り返る '+icon('arrow-right'),'feedback','primary')}${button('先輩への報告も練習する','handoff','secondary')}`:`<label class="ck-soft" for="ck-reply">操作例：返し方を選んで送信</label><select id="ck-reply" class="ck-sample-select"><option value="repair" ${s.reply==='repair'?'selected':''}>本人の気持ちを確かめる</option><option value="push" ${s.reply==='push'?'selected':''}>予定をそのまま伝える</option><option value="ask" ${s.reply==='ask'?'selected':''}>「今は」の意味を聞き返す</option></select>${button(icon(s.quiet?'message-square':'mic')+' サンプル発話を送る','sample','primary')}`}${s.hint?'<div class="ck-hint">一度、相手の言葉を受け止めてから、まだ分からないことを一つだけたずねてみましょう。</div>':''}<div class="ck-row">${button(s.hint?'ヒントを閉じる':'少しヒント','hint','link')}${button('ここで終える','feedback','link')}</div></div>`,null,true);}
function feedback(){if(!s.voice)return phone(titlebar('会話のふりかえり','home')+`<div class="ck-body"><div class="ck-eyebrow">NO UTTERANCE YET</div><h1 class="ck-title">まだ発話が<br>ありません。</h1><div class="ck-note">発話がないときは評価を作りません。サンプル発話を送ると、ふりかえりの操作例を確認できます。</div>${button('会話へ戻る','retry','primary')}</div>`,null);const pushed=s.reply==='push';return phone(titlebar('会話のふりかえり','home')+`<div class="ck-body"><div class="ck-eyebrow">ONE THING TO TRY AGAIN</div><h1 class="ck-title">この一言を、<br>もう一度。</h1><p class="ck-soft">文法だけでなく、会話で何を確認できたか。</p><div class="ck-proof"><small>あなたの発話 · サンプル 00:18</small><p>「${pushed?'お風呂の時間です。行きましょう。':s.reply==='ask'?'「今は」というのは、あとならよいですか。':'何か気になることはありますか。'}」</p></div><div class="ck-evidence-row">${icon(pushed?'circle-help':'circle-check')}<div>${pushed?'予定は短く伝えられています。':'本人の気持ちを確認する問いかけがありました。'}</div></div><div class="ck-feedback"><span class="ck-eyebrow">次の一歩</span><strong>${pushed?'予定の前に、本人の希望を。':'確かめたことを、先輩にも。'}</strong><p>${pushed?'「今は入りたくない」という言葉を一度受け止め、気になることをたずねてみましょう。':'「寒いので今日はやめたい」という本人の言葉と、まだ分からないことを分けて伝えてみましょう。'}</p></div><div class="ck-proof"><small>使ってみたい一言</small><p>「今日は入りたくないのですね。何か気になることはありますか。」</p>${button(s.saved?'ことば帳に保存しました ✓':'ことば帳に残す '+icon('bookmark'),'save','link')}</div>${button('言い直してみる '+icon('rotate-ccw'),'retry','primary')}${button('先輩への報告へ','handoff','link')}<p class="ck-soft">実装時は認識された発話を確認・修正してから評価します。</p></div>`,null);}
function handoff(){return phone(titlebar('先輩に、どう伝える？','feedback')+`<div class="ck-body"><span class="ck-tag">申し送り · 練習</span><h1 class="ck-title">分かっていることを、<br>短く伝える。</h1><p class="ck-soft">架空の練習場面です。実在する方の情報は入力しません。</p><label class="ck-field">いつ・どの場面？<input value="入浴の声かけをしたとき" aria-label="いつ・どの場面"></label><label class="ck-field">本人が話したこと<input value="寒いので、今日は入浴をやめたいとのことです" aria-label="本人が話したこと"></label><label class="ck-field">確認したこと・まだ分からないこと<textarea rows="3" aria-label="確認したことと不明なこと">入浴したくない気持ちを確認しました。今後の対応について相談したいです。</textarea></label>${button('報告の組み立てを確認','report','primary')}${s.report?'<div class="ck-note">サンプル確認：場面・本人の言葉・相談したいことが分かれています。推測を事実として足さずに伝えましょう。</div>':''}${button('同じ場面をもう一度','retry','link')}</div>`,null);}
function library(){return phone(titlebar('場面を選ぶ')+`<div class="ck-body"><div class="ck-eyebrow">SCENE LIBRARY</div><h1 class="ck-title">今日、気になった<br>場面から。</h1><div class="ck-filter">${['すべて','入浴','排泄','食事','申し送り','指示確認','移乗'].map(t=>`<button type="button" data-action="filter" data-value="${t}" class="cursor-interaction" aria-pressed="${t===s.category}">${t}</button>`).join('')}</div>${sceneList.filter(x=>s.category==='すべて'||x[0]===s.category).map(x=>`<button type="button" data-action="${x[0]==='入浴'?'start':'sceneinfo'}" class="ck-small-task cursor-interaction"><span class="ck-task-icon">${icon(x[3])}</span><span class="ck-task-copy"><strong>${x[1]}</strong><small>${x[2]}</small></span>${icon('chevron-right')}</button>`).join('')}<div class="ck-note">${s.hint?'本稿の会話操作例は「入浴を断られたとき」です。ほかの場面は構成例として表示しています。':'同じ場面でも、相手の返答と必要な確認が変わります。'}</div></div>`,'library');}
function phrases(){return phone(titlebar('自分のことば帳')+`<div class="ck-body"><div class="ck-eyebrow">WORDS I CAN USE</div><h1 class="ck-title">使いたい一言を、<br>自分のものに。</h1>${s.saved?'<div class="ck-proof"><span class="ck-tag">入浴 · 希望を確かめる</span><p>「何か気になることはありますか。」</p><small>入浴のふりかえりから保存</small></div>':'<div class="ck-empty">ふりかえりで「ことば帳に残す」を選ぶと、ここに集まります。</div>'}<div class="ck-proof"><span class="ck-tag">聞き返し · 初期サンプル</span><p>「すみません。もう一度、ゆっくりお願いできますか。」</p>${button('この一言から練習する','retry','link')}</div><p class="ck-soft">実装計画：保存した表現を、別の場面でも使えるか復習。</p></div>`,'phrases');}
function review(){return phone(titlebar('自分のふりかえり')+`<div class="ck-body"><div class="ck-eyebrow">SMALL CHANGES, REAL WORDS</div><h1 class="ck-title">点数より、<br>変わった一言。</h1><div class="ck-proof"><small>はじめの発話 · 比較例</small><p>「はい、分かりました。」</p></div><div class="ck-proof"><small>言い直し · 比較例</small><p>「先に、どちらのお部屋へ行けばよいですか。」</p></div><div class="ck-note">理解したふりをせず、分からない部分を具体的にたずねられた。</div>${button('入浴のふりかえりを見る','pastfeedback','primary')}<h2 class="ck-section-title">共有する範囲を、自分で選ぶ</h2><p class="ck-soft">個人練習の音声は、施設担当者へ自動共有しない設計です。課題の観察結果と、本人が選んだ例だけを共有します。</p></div>`,'review');}
function account(){return phone(titlebar('プランの検討案')+`<div class="ck-body"><span class="ck-tag">価格は検証前の仮説</span><h1 class="ck-title">同じ教材を、<br>自分のペースで。</h1><div class="ck-scene-card"><div class="ck-eyebrow">PERSONAL</div><div class="ck-price">¥1,980 <span>/ 月・税込の想定</span></div><p class="ck-soft">全場面・文字練習・ことば帳・個別のふりかえり</p><div class="ck-note">リアルタイム音声 60分 / 月</div><p class="ck-soft">残り時間と更新日を表示し、追加購入は本人が選択。</p></div><p class="ck-soft">施設契約でも学習内容は同じです。施設版には課題配信と学習サポート機能が付きます。</p>${button('学習に戻る','home','primary')}<p class="ck-soft" style="margin-top:12px">本プレビューに決済機能はありません。</p></div>`,null);}
function admin(){const sidebar=`<aside class="ck-sidebar"><div class="ck-eyebrow">SUPPORT, NOT RANKING</div>${[['overview','layout-dashboard','今週のサポート'],['learners','users-round','学習者'],['editor','notebook-pen','施設の練習カード']].map(([a,i,t])=>`<button type="button" data-action="adminpage" data-value="${a}" class="cursor-interaction ${s.admin===a?'ck-current':''}">${icon(i)}${t}</button>`).join('')}</aside>`;let body='';if(s.admin==='editor'){body=`<div class="ck-eyebrow">FACILITY PRACTICE CARD</div><h1>現場の言い方を、<br>みんなの練習に。</h1><p class="ck-soft">実在の利用者の情報は使わず、教育担当者が公開前に確認します。</p><div class="ck-editor-grid"><label class="ck-field">練習タイトル<input value="入浴を断られたとき" aria-label="練習タイトル"></label><label class="ck-field">施設で使う呼び方<input value="担当の先輩" aria-label="施設で使う呼び方"></label></div><label class="ck-field">練習で確かめたいこと<textarea rows="3" aria-label="練習で確かめたいこと">本人の希望を言葉にして確認し、分かっていることと未確認のことを分けて先輩に相談する。</textarea></label><div class="ck-note">公開前の確認：架空の場面 / 表現の確認 / 施設の連絡先・固有名詞なし</div><div class="ck-row">${button(s.published?'サンプル公開済み ✓':'確認してサンプル公開','publish','primary')}${button('学習者側の見え方','preview','secondary')}</div>${s.published?'<div class="ck-local-message" role="status">この概念稿内だけで公開状態を変更しました。実際の配信は行っていません。</div>':''}`;}else if(s.admin==='detail'){body=`<div class="ck-eyebrow">LEARNER ${s.person} · SAMPLE</div><h1>次に一緒に、<br>何を練習する？</h1><div class="ck-week"><span class="ck-tag">学習者 ${s.person} · 架空データ</span><h2>「分からないところ」を、具体的に。</h2><div class="ck-quote-mini">「先に、どちらのお部屋へ行けばよいですか。」</div><p class="ck-soft">本人が選んだ発話例だけを表示。音声の自動共有はありません。</p></div><div class="ck-observations"><div class="ck-observation"><span class="ck-eyebrow">観察されたこと</span><strong>場所を聞き返せた</strong><p>ヒントなし · 指示確認の練習例</p></div><div class="ck-observation"><span class="ck-eyebrow">次の練習</span><strong>時間と順番も確かめる</strong><p>異なる場面で再確認</p></div></div>${button(s.assigned?'今週の課題に追加しました ✓':'90秒の練習を提案する','assign','primary')}${button('一覧に戻る','adminback','link')}`;}else{body=`<div class="ck-row"><div><div class="ck-eyebrow">WEEKLY SUPPORT · SAMPLE FACILITY</div><h1>${s.admin==='learners'?'一人ずつ、次の練習へ。':'今週、一緒に\n練習したいこと。'}</h1><p class="ck-soft">施設・学習者・観察内容は、すべて架空のサンプルです。</p></div>${button('施設のカードを作る','editor','secondary')}</div><section class="ck-week"><div class="ck-row"><span class="ck-tag">今週の共通課題</span><span class="ck-soft">4分 × 週3回の想定</span></div><h2>「あとで」の意味を、確かめる。</h2><p class="ck-soft">理解したつもりで進めず、本人の希望を具体的に聞き返す。</p><div class="ck-row" style="margin-top:15px">${button(s.assigned?'サンプル配信済み ✓':'課題を配信する','assign','primary')}${button('学習画面で確認','preview','secondary')}</div>${s.assigned?'<div class="ck-local-message" role="status">プレビュー内の課題状態を更新しました。</div>':''}</section><div class="ck-observations"><div class="ck-observation"><span class="ck-eyebrow">次回の声かけ候補</span><strong>聞き返す内容を、具体的に</strong><p>対象例：学習者 A・C / 理由は各発話から確認</p></div><div class="ck-observation"><span class="ck-eyebrow">担当者の確認</span><strong>週5分で、次の課題を選ぶ</strong><p>所要時間は検証前の目標です</p></div></div><h2 class="ck-section-title">学習サポートのメモ</h2>${['A','B','C'].map((p,i)=>`<div class="ck-learner-row"><span class="ck-avatar">${p}</span><div><strong>学習者 ${p}</strong><p>${['場所を確認できた。次は時間と順番。','本人の希望を受け止める表現を復習。','聞き返しのヒントを減らして再練習。'][i]}</p></div><button type="button" class="cursor-interaction" data-action="person" data-value="${p}">発話例を見る ${icon('chevron-right')}</button></div>`).join('')}<div class="ck-note">ここで扱うのは練習の観察結果です。職務能力の認定や、職員の順位付けは行いません。</div>`;}return `<section class="ck-admin" aria-label="施設担当者の画面"><div class="ck-admin-header"><div class="ck-wordmark">Care Kotoba <span class="ck-soft">/ 施設の学習サポート</span></div><span class="ck-tag">デザイン用の架空データ</span></div><div class="ck-admin-grid">${sidebar}<main class="ck-admin-main">${body}</main></div></section>`;}
function render(){root.querySelectorAll('.ck-mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.action===s.mode));const screens={home,brief,voice,feedback,handoff,library,phrases,review,account};stage.innerHTML=s.mode==='admin'?admin():(screens[s.screen]||home)();if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});}
root.addEventListener('change',e=>{if(e.target.id==='ck-reply')s.reply=e.target.value;});
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||!root.contains(b))return;const a=b.dataset.action;if(a==='learner'||a==='admin'){s.mode=a;}else if(a==='adminpage'){s.admin=b.dataset.value;}else if(a==='adminback'){s.admin='overview';}else if(a==='editor'){s.admin='editor';}else if(a==='person'){s.person=b.dataset.value;s.admin='detail';}else if(a==='assign'){s.assigned=true;}else if(a==='publish'){s.published=true;}else if(a==='preview'){s.mode='learner';s.screen='brief';}else if(a==='sceneinfo'){s.category=b.querySelector('strong').textContent.includes('先輩')?'申し送り':s.category;s.screen='library';s.hint=1;}else if(a==='quiet'){s.quiet=!s.quiet;}else if(a==='level'){s.level=s.level==='やさしい'?'自然な会話':'やさしい';}else if(a==='start'){s.screen='brief';}else if(a==='begin'||a==='retry'){s.screen='voice';s.voice=0;s.hint=0;}else if(a==='sample'){s.voice=1;}else if(a==='pastfeedback'){s.voice=1;s.reply='repair';s.screen='feedback';}else if(a==='hint'||a==='help'){s.hint=s.hint?0:1;if(s.screen!=='voice'&&s.mode==='learner')s.screen='brief';}else if(a==='save'){s.saved=true;}else if(a==='report'){s.report=true;}else if(a==='filter'){s.category=b.dataset.value;s.screen='library';}else if(['home','library','phrases','review','feedback','handoff','account'].includes(a)){s.screen=a;}render();});
render();
})();
</script>
