name: Prepare explicitly approved dependency lockfiles
on:
  pull_request:
    paths: [.github/workflows/prepare-review-deps.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'codex/REVIEW-DEP-001' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve only user-approved exact versions; never run package scripts
        working-directory: prototype
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          mkdir -p ../prepared-deps/review ../prepared-deps/a11y ../prepared-deps/packages
          npm view ts-fsrs dist-tags --json > ../prepared-deps/ts-fsrs-dist-tags.json
          npm view ts-fsrs@5.4.2 --json > ../prepared-deps/ts-fsrs-metadata.json
          npm view @axe-core/playwright@4.14.0 --json > ../prepared-deps/axe-playwright-metadata.json
          pnpm add --lockfile-only --ignore-scripts --save-exact ts-fsrs@5.4.2
          cp package.json pnpm-lock.yaml ../prepared-deps/review/
          pnpm add --lockfile-only --ignore-scripts --save-dev --save-exact @axe-core/playwright@4.14.0
          cp package.json pnpm-lock.yaml ../prepared-deps/a11y/
          npm pack ts-fsrs@5.4.2 --ignore-scripts --json --pack-destination ../prepared-deps/packages > ../prepared-deps/ts-fsrs-pack.json
          npm pack @axe-core/playwright@4.14.0 --ignore-scripts --json --pack-destination ../prepared-deps/packages > ../prepared-deps/axe-playwright-pack.json
      - name: Verify npm integrity and retain actual package notices
        run: |
          python3 - <<'PY'
          import pathlib,json,tarfile,hashlib,base64
          p=pathlib.Path('prepared-deps')
          for name,version,license in [('ts-fsrs','5.4.2','MIT'),('axe-playwright','4.14.0','MPL-2.0')]:
              meta=json.loads((p/f'{name}-metadata.json').read_text())
              assert meta['version']==version and meta['license']==license
              pack=json.loads((p/f'{name}-pack.json').read_text())[0]
              archive=p/'packages'/pack['filename'];data=archive.read_bytes()
              integrity='sha512-'+base64.b64encode(hashlib.sha512(data).digest()).decode()
              assert integrity==meta['dist']['integrity']==pack['integrity']
              out=p/'licenses'/name;out.mkdir(parents=True)
              with tarfile.open(archive) as t:
                  for f in t.getmembers():
                      if f.isfile() and (pathlib.PurePosixPath(f.name).name.lower().startswith(('license','notice','copying')) or f.name=='package/package.json'):
                          assert '..' not in pathlib.PurePosixPath(f.name).parts
                          (out/pathlib.PurePosixPath(f.name).name).write_bytes(t.extractfile(f).read())
              archive.unlink()
              print(name,version,license,integrity)
          (p/'source.txt').write_text('${{ github.event.pull_request.head.sha }}\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-dependency-locks
          path: prepared-deps/
          retention-days: 7
          if-no-files-found: error
