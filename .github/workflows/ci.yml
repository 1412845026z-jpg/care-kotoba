name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A PR and its branch push share one group, avoiding duplicate runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, TypeScript, build, mock tests (no API)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Scan tracked files and archived ZIP entries (no key needed)
        working-directory: .
        run: |
          python3 scripts/ci/scan_secrets.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Validate fictional scenario and evaluation data (no API)
        working-directory: .
        run: |
          python3 evals/validate.py
          python3 content/terminology/validate.py
          python3 evals/source-confidence/validate.py
          python3 content/review/build.py --check
          python3 tools/ssw-basic/build.py --check
          python3 tools/ssw-basic/check_locales.py
          python3 -m unittest discover -s tools/ssw-basic -p 'test_check_locales.py' -v
          python3 -m unittest discover -s evals -p 'test_*.py' -v
      - name: Corepack from packageManager; verify portable mode
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { readExecutionProfile } from './scripts/execution-profile.mjs';
          const [major, minor] = process.versions.node.split('.').map(Number);
          if (major !== 22 || minor < 13) throw new Error('CI requires Node 22 >=22.13');
          const { packageManager } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^pnpm@\d+\.\d+\.\d+$/.test(packageManager)) throw new Error('Expected pinned pnpm packageManager');
          execFileSync('corepack', ['enable'], { stdio: 'inherit' });
          execFileSync('corepack', ['prepare', packageManager, '--activate'], { stdio: 'inherit' });
          console.log(`Node ${process.version}; ${packageManager}; profile=${readExecutionProfile()}`);
          if (readExecutionProfile() !== 'portable') throw new Error('CI must use portable mode');
          JS
          pnpm --version
      - name: Install with frozen lockfile
        run: node scripts/ci-step.mjs pnpm install --frozen-lockfile
      - name: TypeScript
        run: node scripts/ci-step.mjs node node_modules/typescript/bin/tsc --noEmit
      - name: Production build (portable, no deploy)
        run: node scripts/ci-step.mjs pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Static, unit and browser tests (local mock API only)
        env:
          CK_TEST_TIMEOUT_SECONDS: "600"
        run: NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/ci/local_fetch_only.mjs" node tests/run.mjs all --report "$GITHUB_WORKSPACE/mock-tests.json"
      - name: Keep test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mock-tests-${{ github.sha }}
          path: mock-tests*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Confirm dependency manifests were not rewritten
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml

  a11y:
    name: Accessibility (offline gates + informational axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Use pinned pnpm
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const [major, minor] = process.versions.node.split('.').map(Number);
          if (major !== 22 || minor < 13) throw new Error('CI requires Node 22 >=22.13');
          const { packageManager } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^pnpm@\d+\.\d+\.\d+$/.test(packageManager)) throw new Error('Expected pinned pnpm');
          execFileSync('corepack', ['enable'], { stdio: 'inherit' });
          execFileSync('corepack', ['prepare', packageManager, '--activate'], { stdio: 'inherit' });
          JS
      - name: Install frozen dependencies and Chromium
        run: |
          node scripts/ci-step.mjs pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Audit two viewports and report axe findings (loopback mocks only)
        working-directory: .
        run: node scripts/ci/run_a11y.mjs --out a11y-results
      - name: Add accessibility summary
        if: ${{ always() }}
        working-directory: .
        run: |
          if [ -f a11y-results/summary.md ]; then cat a11y-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep accessibility reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a11y-${{ github.sha }}
          path: a11y-results/
          retention-days: 7
          if-no-files-found: error
      - name: Confirm dependency manifests were not rewritten
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
