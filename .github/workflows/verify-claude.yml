name: Pinned Claude mock verification

on:
  pull_request:
    paths:
      - .github/workflows/verify-claude.yml
      - scripts/ci/verify_claude.py
      - verification/ENV-004/request.json
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character source commit SHA to verify (mock API only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pinned-claude-review-${{ github.ref }}
  cancel-in-progress: true

# Fixed-source review: supply a full SHA manually, or commit an explicit review
# request file on the ENV-004 tooling PR. No source SHA is hardcoded in this workflow.
jobs:
  mock-review:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/ENV-004'
    name: Source review / mock only / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout review tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve explicit source request
        id: request
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const sha = process.env.REQUESTED_SHA || JSON.parse(readFileSync('verification/ENV-004/request.json', 'utf8')).sha;
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('A full 40-character source SHA is required');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          JS
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.sha }}
          path: verified-source
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Pin package manager and source; reject credential environment
        id: source
        working-directory: verified-source/prototype
        env:
          REVIEW_SHA: ${{ steps.request.outputs.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          [[ "$REVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTUAL_SHA" = "$REVIEW_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p ../../review-results
          git show -s --format='%H %T' > ../../review-results/source.txt
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const [major, minor] = process.versions.node.split('.').map(Number);
          if (major !== 22 || minor < 13) throw new Error('Node 22 >=22.13 required');
          const { packageManager } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^pnpm@\d+\.\d+\.\d+$/.test(packageManager)) throw new Error('Pinned pnpm required');
          if (Object.keys(process.env).some(k => /^(OPENAI_|CK_)/.test(k))) throw new Error('Unexpected AI/access environment');
          execFileSync('corepack', ['enable'], { stdio: 'inherit' });
          execFileSync('corepack', ['prepare', packageManager, '--activate'], { stdio: 'inherit' });
          console.log(`reviewed source: ${execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim()}; Node ${process.version}; ${packageManager}`);
          JS
      - name: Frozen install
        working-directory: verified-source/prototype
        run: node scripts/ci-step.mjs pnpm install --frozen-lockfile
      - name: Real TypeScript
        working-directory: verified-source/prototype
        run: node scripts/ci-step.mjs node node_modules/typescript/bin/tsc --noEmit
      - name: Real production build (no deployment)
        working-directory: verified-source/prototype
        run: node scripts/ci-step.mjs pnpm build
      - name: Static and unit tests
        working-directory: verified-source/prototype
        env:
          CK_TEST_TIMEOUT_SECONDS: "600"
        run: |
          mkdir -p ../../review-results
          node tests/run.mjs static --report ../../review-results/static.json
          node tests/run.mjs unit --report ../../review-results/unit.json
      - name: Install official Chromium
        working-directory: verified-source/prototype
        run: pnpm exec playwright install --with-deps chromium
      - name: Offline browser suite (simulated AI and WebRTC peer)
        id: offline
        continue-on-error: true
        run: python3 scripts/ci/verify_claude.py --source verified-source --mode offline --report-dir review-results/offline
      - name: Real Vinext dev browser suite (simulated AI and WebRTC peer)
        id: realdev
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 scripts/ci/verify_claude.py --source verified-source --mode real-dev --report-dir review-results/real-dev
      - name: Confirm tracked source restored and no fake environment remains
        if: ${{ !cancelled() }}
        working-directory: verified-source
        run: |
          git diff --exit-code
          test ! -e prototype/.dev.vars
          test ! -e prototype/.env.local
      - name: Keep diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag resolved 2026-10-24 JST
        with:
          name: mock-review-${{ steps.source.outputs.sha }}
          path: review-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Report browser failures without hiding either suite
        if: ${{ !cancelled() }}
        env:
          OFFLINE_RESULT: ${{ steps.offline.outcome }}
          REALDEV_RESULT: ${{ steps.realdev.outcome }}
        run: |
          test "$OFFLINE_RESULT" = success
          test "$REALDEV_RESULT" = success
