受容を意識して、まず「今はしたくない」という気持ちを受け止めます。","feedback_guard_zh":"不把「先接受拒绝」教成取消所有必要的沟通或报告。","scenario_ids":["CK-R01","CK-R04"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":209,"printed_entry_page":39,"pdf_entry_page":45,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T010","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"共感","reading_ja":"きょうかん","learning_gloss":{"zh-Hans":"尝试理解对方的感受，并用不替对方下结论的语言回应。","en":"Trying to understand a feeling without claiming to know its cause."},"example_ja":"共感を示すときも、話されていない気持ちを決めつけないようにします。","feedback_guard_zh":"没有说过的情绪和原因，不替本人编造。","scenario_ids":["CK-R02","CK-R03"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":204,"printed_entry_page":38,"pdf_entry_page":44,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T011","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"自己決定","reading_ja":"じこけってい","learning_gloss":{"zh-Hans":"本人表达自己的选择；练习允许对方拒绝，不把顺从当成功标准。","en":"The person expressing their own choice, including declining."},"example_ja":"自己決定を尊重して、今日は参加しないという希望を担当者に伝えます。","feedback_guard_zh":"不能因为最终没有参加或没有入浴就自动判学员失败。","scenario_ids":["CK-R01","CK-R02","CK-R04"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":208,"printed_entry_page":5,"pdf_entry_page":11,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T012","version":"0.1.1","status":"draft_pendi age":207,"printed_entry_page":15,"pdf_entry_page":21,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T015","version":"0.1.0","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"参加","reading_ja":"さんか","learning_gloss":{"zh-Hans":"加入某项活动；本人也可以表达不参加。","en":"Taking part in an activity, which the person may also decline."},"example_ja":"今日は参加されないのですね。","feedback_guard_zh":"不把拒绝参加解释为性格问题或不配合。","scenario_ids":["CK-R04"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":208,"printed_entry_page":25,"pdf_entry_page":31,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T016","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"自覚症状","reading_ja":"じかくしょうじょう","learning_gloss":{"zh-Hans":"本人感受到并表达的不适；报告时保留本人原话和信息来源。","en":"A symptom experienced and reported by the person."},"example_ja":"自覚症状について、中村さんは「左のひざが痛い」と話しています。原因は未確認です。","feedback_guard_zh":"本人说过什么可以被确认；疼痛的原因和诊断可能仍未确认。","scenario_ids":["CK-P01"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":208,"printed_entry_page":75,"pdf_entry_page":81,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T017","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"摂取","reading_ja":"せっしゅ","learning_gloss":{"zh-Hans":"摄入；本练习只描述已知的单次情况，不自行推定营养或病因。","en":"Intake; describe only the observed occasion in this exercise."},"example_ja":"今日の昼食の摂取量について、私が確認した範囲を報告します。","feedback_guard_zh":"不知道数量时不能给出数字，也不能推出近几天一直如此。","scenario_ids":["CK-P02"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":212,"printed_entry_page":76,"pdf_entry_page":82,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T018","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"摂食","reading_ja":"せっしょく","learning_gloss":{"zh-Hans":"进食；拒绝进食时先回应本人的意思，不凭一句话判断原因。","en":"Eating; acknowledge a refusal without inventing its cause."},"example_ja":"摂食の様子は、まだ自分では確認していません。","feedback_guard_zh":"不得从拒绝推断疾病、吞咽状态或长期食欲。","scenario_ids":["CK-R02","CK-P02"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":212,"printed_entry_page":49,"pdf_entry_page":55,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T019","version":"0.1.0","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"転倒","reading_ja":"てんとう","learning_gloss":{"zh-Hans":"跌倒；只有发现时的姿势，不一定能确认发生过跌倒。","en":"A fall; finding someone on the floor does not establish how they got there."},"example_ja":"転倒したかどうかは、まだ確認できていません。","feedback_guard_zh":"本词条训练事实报告，不教授遇到跌倒后的处置步骤。","scenario_ids":["CK-P03"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":215,"printed_entry_page":45,"pdf_entry_page":51,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T020","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"転落","reading_ja":"てんらく","learning_gloss":{"zh-Hans":"从某处跌落；未目击过程时，不把它当作已经确认的原因。","en":"Falling from a higher place; do not assert an unseen event."},"example_ja":"転落したかどうかは分かりません。床に座っている姿だけを見ました。","feedback_guard_zh":"不在転倒、転落或主动坐下之间猜一个作为报告事实。","scenario_ids":["CK-P03"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":215,"printed_entry_page":45,"pdf_entry_page":51,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T021","version":"0.1.0","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"移乗","reading_ja":"いじょう","learning_gloss":{"zh-Hans":"从床、椅子等一个位置转到另一位置；此处只训练询问不清楚的请求。","en":"Moving between a bed, chair or similar place; this card covers clarification only."},"example_ja":"どこからどこへの移乗でしょうか。","feedback_guard_zh":"词义卡不包含具体搬移动作、人数或个体照护方案。","scenario_ids":["CK-C03","CK-P03"],"placement":"transfer_only","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":199,"printed_entry_page":45,"pdf_entry_page":51,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T022","version":"0.1.0","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"清拭","reading_ja":"せいしき","learning_gloss":{"zh-Hans":"用毛巾等擦拭身体；本卡只用于理解词义与请求确认。","en":"Wiping the body; this card covers vocabulary and clarification only."},"example_ja":"清拭という言葉の意味を、教えていただけますか。","feedback_guard_zh":"知道读音不等于知道对象、范围、时点或本人意愿。","scenario_ids":["CK-C03"],"placement":"transfer_only","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":212,"printed_entry_page":55,"pdf_entry_page":61,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T023","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"口腔ケア","reading_ja":"こうくうケア","learning_gloss":{"zh-Hans":"口腔相关的清洁照护；练习重点是没听懂时请对方解释。","en":"Care of the mouth; the exercise is asking for an explanation."},"example_ja":"口腔ケアの、どの準備をすればよいですか。","feedback_guard_zh":"不把这个泛称扩写为具体器具、手法或医疗建议。","scenario_ids":["CK-C03"],"placement":"transfer_only","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":206,"printed_entry_page":54,"pdf_entry_page":60,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T024","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"水分補給","reading_ja":"すいぶんほきゅう","learning_gloss":{"zh-Hans":"补充水分；本卡练习确认指示，不设定任何人的饮水量或限制。","en":"Taking fluids; this card does not set an amount or individual care plan."},"example_ja":"水分補給について、今回頼まれた準備の内容を確認します。","feedback_guard_zh":"没有明确给出的饮水量、限制与本人意愿不得补造。","scenario_ids":["CK-C03","CK-R02"],"placement":"transfer_only","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":211,"printed_entry_page":49,"pdf_entry_page":55,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T025","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"部分清拭","reading_ja":"ぶぶんせいしき","learning_gloss":{"zh-Hans":"擦拭身体的一部分；不清楚范围时需要明确问出来。","en":"Wiping part of the body; ask which part if it is unspecified."},"example_ja":"部分清拭とは、どのような意味ですか。","feedback_guard_zh":"本卡不把任何身体部位设为默认作业范围。","scenario_ids":["CK-C03"],"placement":"transfer_only","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":220,"printed_entry_page":56,"pdf_entry_page":62,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T026","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"主観的事実","reading_ja":"しゅかんてきじじつ","learning_gloss":{"zh-Hans":"这里用于区分本人感受或发话这一来源，不能与「未确认」画等号。","en":"Information about a reported experience; subjective does not mean unconfirmed."},"example_ja":"主観的事実を伝えるときは、ご本人の言葉と、誰から聞いたかを添えます。","feedback_guard_zh":"「本人说痛」与「疼痛原因」是两个断言，分别标信息来源和确认状态。","scenario_ids":["CK-C04","CK-P01","CK-P04"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":209,"printed_entry_page":72,"pdf_entry_page":78,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T027","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待介护经验者与日语教育者审稿","fictional_examples":true,"ja":"客観的事実","reading_ja":"きゃっかんてきじじつ","learning_gloss":{"zh-Hans":"可观察或测量的信息；仍要说明谁、何时、怎样获取，不能自动推定原因。","en":"Observable information, with its observer, time and limits stated."},"example_ja":"客観的事実として、14時10分に床に座っている姿を見たと報告します。","feedback_guard_zh":"观察到的姿势是一个事实；事故过程和原因是另外的断言。","scenario_ids":["CK-C04","CK-P02","CK-P03","CK-P04"],"placement":"core","provenance":{"kind":"common_headword_reference","source_id":"mhlw-glossary-zh-2021","index_pdf_page":204,"printed_entry_page":72,"pdf_entry_page":78,"copied_definition":false,"copied_artwork":false},"authorship":"Learning glosses, examples, scene mapping and feedback guards authored for Care Kotoba."},{"id":"CK-T028","version":"0.1.1","status":"draft_pending_expert_review","review_notice":"草稿，待 <script>
'use strict';
const data=JSON.parse(document.getElementById('ck-data').textContent);
const $=id=>document.getElementById(id);
const storageKey='ck-review-notes-v1-'+data.source_digest;
$('corpus-counts').textContent=data.scenarios.length+' 场景 · '+data.terms.length+' 术语 · '+(data.evals.length+data.pairs.length)+' 评测草稿';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const skills={clarification:'主动问清',refusal_respect:'尊重拒绝',report_certainty:'区分已知与未确认'};
const labels={met:'达到目标',missed:'明确遗漏',uncertain:'先确认转写',not_applicable:'不适用'};
const knownIds=new Set(data.scenarios.map(s=>s.id));
let current=data.scenarios[0].id, tab='scene', notes=new Map(), storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))for(const entry of saved){if(Array.isArray(entry)&&knownIds.has(entry[0])&&entry[1]&&typeof entry[1].note==='string')notes.set(entry[0],{note:entry[1].note.slice(0,20000),recommendation:['unmarked','revise','keep_as_draft'].includes(entry[1].recommendation)?entry[1].recommendation:'unmarked'});}}catch{storageAvailable=false;}
function list(items){return '<ul class="small-list">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}
function card(title,body,cls=''){return '<article class="card '+cls+'"><h2>'+esc(title)+'</h2>'+body+'</article>';}
function oldScore(e){return '<h3>语言目标的草稿判断</h3>'+list(Object.entries(e.labels).map(([k,v])=>(skills[k]||k)+'：'+(labels[v]||v)))+'<h3>可以引用的学员原话</h3>'+list(e.feedback_evidence.map(x=>x.quote))+'<h3>下一步</h3><p>'+esc(e.next_step_zh)+'</p><h3>不可推定的内容</h3>'+list(e.must_not_claim_zh);}
function pairScore(e){const names={quote_attribution:'原话引用',source_and_verification:'来源与核实状态',bounded_inference:'推断范围',respect_refusal:'尊重拒绝',transcript_uncertainty:'转写不确定'};const values={pass:'符合此项',fail:'需要修正',not_applicable:'此片段不评价'};return '<h3>候选反馈的草稿判断</h3><p>'+(e.acceptable?'可接受':'需要修正')+' · '+esc(e.reason_zh)+'</p>'+list(Object.entries(e.gates).map(([k,v])=>names[k]+'：'+values[v]))+'<h3>可靠的学员原话依据</h3>'+(e.feedback_evidence.length?list(e.feedback_evidence.map(x=>x.quote_ja)):'<p>关键转写不足，先确认，不提供硬评分引文。</p>');}
function selectScene(id){if(!knownIds.has(id))return;current=id;render();if(matchMedia('(max-width:720px)').matches)$('nav-toggle').open=false;}
function renderNav(){const query=$('search').value.trim().toLowerCase();const scenes=data.scenarios.filter(s=>(s.id+' '+JSON.stringify(s)+' '+(skills[s.primary_skill]||'')).toLowerCase().includes(query));$('scene-count').textContent=scenes.length+' / '+data.scenarios.length;let last='';$('nav-list').innerHTML=scenes.map(s=>{const group=skills[s.primary_skill]||s.primary_skill;const heading=last!==group?'<div class="nav-group">'+esc(group)+'</div>':'';last=group;return heading+'<button type="button" class="scene-button" data-scene="'+esc(s.id)+'" aria-current="'+(s.id===current)+'"><span><span class="scene-id">'+esc(s.id)+'</span>'+esc(s.title_ja)+'</span></button>';}).join('')||'<div class="empty">没有匹配的场景</div>';document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>selectScene(b.dataset.scene));}
function render(){const s=data.scenarios.find(x=>x.id===current);renderNav();$('scene-heading').innerHTML='<div class="scene-top"><span class="eyebrow">'+esc(s.id)+' · '+esc(s.version)+'</span><span class="pill">'+esc(skills[s.primary_skill]||s.primary_skill)+'</span></div><h1 class="jp">'+esc(s.title_ja)+'</h1><div class="muted">'+esc(s.setting_ja)+' · 对话角色：'+esc(s.npc_role_ja)+'</div>';
const good=s.examples.map(x=>'<div class="example jp">'+esc(x.learner_ja)+'</div><p class="muted">'+esc(x.why_acceptable_zh)+'</p>').join('');
const counter=s.counterexamples.map(x=>'<div class="example jp">'+esc(x.learner_ja)+'</div><p class="muted jp">'+esc(x.why_problematic_ja)+'</p>').join('');
$('panel-scene').innerHTML=card('角色开场','<div class="jp">'+esc(s.opening_ja)+'</div>','opening')+card('这次要练什么',list(s.learning_objectives_ja))+'<div class="cols">'+card('学员已知的信息',list(s.learner_known_ja))+card('隐藏信息 · 仅供审稿','<details><summary>展开角色未揭示的信息</summary><p class="muted">未揭示前，不应把它当作学员必须知道的答案。</p>'+list(s.hidden_information.map(x=>x.id+' · '+x.fact_ja))+'</details>','hidden-info')+'</div>'+card('对话分支',s.conversation_branches.map(b=>'<details class="branch"><summary>'+esc(b.id)+' · '+esc(b.trigger_zh)+'</summary><div class="example jp">'+esc(b.npc_reply_ja)+'</div><p>'+esc(b.coach_rule_zh)+'</p><span class="tag">揭示：'+esc(b.reveals.join('、')||'无')+'</span></details>').join(''))+'<div class="cols">'+card('可接受的表达例子',good,'good')+card('反例 · 不作为推荐回应',counter,'counter')+'</div>'+card('反馈规则',list(s.feedback_rules_zh))+card('迁移练习','<p class="jp">'+esc(s.transfer_task.prompt_ja)+'</p>'+list(s.transfer_task.expected_intents_ja));
function termRuby(t){
 if(!/[一-龯々]/.test(t.ja))return esc(t.ja);
 const suffix=t.ja.match(/[ァ-ヺー・]+$/)?.[0]||'';
 if(suffix&&t.reading_ja.endsWith(suffix))return '<ruby>'+esc(t.ja.slice(0,-suffix.length))+'<rt>'+esc(t.reading_ja.slice(0,-suffix.length))+'</rt></ruby>'+esc(suffix);
 return '<ruby>'+esc(t.ja)+'<rt>'+esc(t.reading_ja)+'</rt></ruby>';
}
const relevant=data.terms.filter(t=>t.scenario_ids.includes(current));$('panel-terms').innerHTML='<p class="muted">'+relevant.length+' 条关联术语。迁移候选不改变原场景的已知信息。</p>'+relevant.map(t=>card(t.placement==='core'?'本场景核心词':'仅供迁移练习','<span class="kicker">'+esc(t.id)+'</span><div class="term jp">'+termRuby(t)+'</div><p>'+esc(t.learning_gloss['zh-Hans'])+'</p><p class="muted">'+esc(t.learning_gloss.en)+'</p><div class="example jp">'+esc(t.example_ja)+'</div><p class="muted">审稿重点：'+esc(t.feedback_guard_zh)+'</p><span class="tag">'+(t.provenance.kind==='common_headword_reference'?'词形/读音参考教材 · 印刷页 '+esc(t.provenance.printed_entry_page)+' / PDF页 '+esc(t.provenance.pdf_entry_page):'项目沟通词条')+'</span>')).join('');
const samples=data.evals.filter(e=>e.scenario_id===current);const pairs=data.pairs.filter(e=>e.scenario_anchor===current);$('panel-evals').innerHTML='<p class="muted">本场景 '+samples.length+' 条固定转写样本 · '+pairs.length+' 条独立反馈评测片段。评分标签是待审稿草稿。</p>'+samples.map(e=>card(e.id,'<span class="tag">'+esc(e.case_type)+'</span>'+e.learner_transcript.map(t=>'<div class="example jp">'+esc(t.utterance_id)+' · '+esc(t.text_ja)+'</div>').join('')+'<details><summary>查看评分草稿与引用依据</summary><div class="data-labels">'+oldScore(e.expected)+'</div></details>')).join('')+pairs.map(e=>card(e.id+' · 独立反馈评测',list(e.facts.map(f=>f.text_ja))+'<h3>学员发话</h3><div class="example jp">'+esc(e.learner_turn.text_ja)+'</div><h3>待判断的反馈候选</h3><p class="jp">'+esc(e.candidate_feedback_ja)+'</p><details><summary>查看评分草稿 · 不作为模型输入</summary><div class="data-labels">'+pairScore(e.expected_feedback)+'</div></details>')).join('');
const note=notes.get(current)||{note:'',recommendation:'unmarked'};$('review-note').value=note.note;$('recommendation').value=note.recommendation;$('save-status').textContent=storageAvailable?(notes.has(current)?'已载入本机审阅记录':'尚未填写本条意见'):'本机保存不可用，请导出JSON保留意见';showTab(tab);}
function showTab(name){tab=name;document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===name;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+name));}
function save(){const note=$('review-note').value.slice(0,20000),recommendation=$('recommendation').value;if(!note.trim()&&recommendation==='unmarked')notes.delete(current);else notes.set(current,{note,recommendation});try{localStorage.setItem(storageKey,JSON.stringify([...notes]));storageAvailable=true;$('save-status').textContent='已在本机保存 · 不代表审批通过';}catch{storageAvailable=false;$('save-status').textContent='本机保存不可用，请导出JSON保留意见';}}
$('search').addEventListener('input',renderNav);$('review-note').addEventListener('input',save);$('recommendation').addEventListener('change',save);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const ids=['scene','terms','evals'];let i=ids.indexOf(tab);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;showTab(ids[i]);$('tab-'+ids[i]).focus();});
$('export').onclick=()=>{save();const report={format:'care-kotoba-review-notes',version:'0.1.0',created_at:new Date().toISOString(),source_digest:data.source_digest,source_files_sha256:data.source_files_sha256,formal_approval:false,notes:[...notes].map(([scenario_id,n])=>({scenario_id,...n}))};const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='Care-Kotoba-review-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('save-status').textContent='已导出审阅意见 · 正式内容未改动';};
$('source-info').textContent='资料版本 '+data.version+' · 来源指纹 '+data.source_digest.slice(0,12)+'。意见与本次资料快照关联。';
if(matchMedia('(max-width:720px)').matches)$('nav-toggle').open=false;
render();
</script>
