<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Care Kotoba · 内容审稿</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans CJK JP",sans-serif;color:#29283b;background:#f7f7fb;font-size:15px;line-height:1.65;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b4a1e9;outline-offset:3px}button{border:1px solid #ddd9e9;border-radius:10px;background:white;color:inherit;padding:9px 14px}button:hover{background:#f1edfa}.primary{background:#7355af;color:white;border-color:#7355af}.primary:hover{background:#614498}header{padding:24px 32px;background:white;border-bottom:1px solid #e7e5ef;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:23px;letter-spacing:-.6px;font-weight:750}.brand small{display:block;font-size:12px;letter-spacing:.05em;color:#777286;font-weight:500}.header-meta{text-align:right;font-size:13px;color:#777286}.pill{display:inline-block;background:#eee8fa;color:#634397;border-radius:20px;font-size:12px;padding:3px 10px}.draft{background:#fff2c9;color:#88641b}.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 280px;gap:24px;max-width:1600px;margin:auto;padding:28px 24px}aside,main{min-width:0}.navigation,.notes{position:sticky;top:20px}h1{font-size:27px;line-height:1.5;letter-spacing:-.7px;margin:9px 0}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:0 0 8px;color:#777286}p{margin:8px 0 14px}.muted{font-size:13px;color:#777286}.eyebrow{color:#8c7aa8;font-size:12px;letter-spacing:.12em}.search{width:100%;padding:10px 12px;border:1px solid #dcd8e7;border-radius:11px;background:white;margin:10px 0 12px}.nav-group{font-size:11px;color:#8b839b;padding:13px 10px 5px;letter-spacing:.1em}.scene-button{width:100%;border:0;background:transparent;text-align:left;display:flex;gap:9px;padding:10px;border-radius:10px;font-size:13px;line-height:1.5;margin:2px 0}.scene-button[aria-current=true]{background:#eae3f7;color:#64449a;font-weight:650}.scene-id{font-size:10px;color:#8c80a3;display:block}.count{font-size:12px;color:#8c80a3}#nav-list{max-height:72vh;overflow:auto}.scene-top{display:flex;gap:10px;align-items:center}.tabs{display:flex;gap:5px;border-bottom:1px solid #e4dfec;margin:24px 0}.tabs button{border:0;background:transparent;border-radius:0;padding:10px 13px;color:#8c839c}.tabs button[aria-selected=true]{color:#634397;border-bottom:3px solid #8b6abd;font-weight:650}.card{background:white;border:1px solid #e7e3ee;border-radius:15px;padding:20px;margin-bottom:18px;overflow-wrap:anywhere}.opening{background:#f1ecf8;border:0;font-size:19px;padding:24px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.good{border-top:3px solid #8db4a5}.counter{border-top:3px solid #d5a38e}.hidden-info{background:#fffaf0;border-color:#f0e2bd}.hidden-info summary{color:#8f6d25}.small-list{padding-left:20px;margin:5px 0}.small-list li{margin:5px 0}.branch{border-top:1px solid #efebf5;padding:14px 0}.branch:first-of-type{border-top:0}.jp{font-family:ui-sans-serif,system-ui,"Noto Sans CJK JP",sans-serif}.term{font-size:20px;line-height:2.1;margin:3px 0 8px}rt{font-size:10px;color:#9c8fb0}summary{cursor:pointer;font-weight:650}.example{padding:12px 14px;background:#f8f6fb;border-radius:8px;margin:10px 0}.notes{background:#f0edf6;border-radius:15px;padding:19px;font-size:13px}.notes label{display:block;font-weight:650;margin:14px 0 6px}.notes textarea,.notes select{width:100%;border:1px solid #d6d0e3;border-radius:9px;background:#fff;padding:9px}.notes textarea{min-height:200px;resize:vertical}.notes button{margin-top:14px;width:100%}.status{min-height:22px;font-size:12px;color:#827495;margin-top:10px}.tag{font-size:10px;border-radius:5px;background:#f0edf6;padding:2px 6px;color:#87739f}.panel{display:none}.panel.active{display:block}.note-count{float:right}.eval-heading{display:flex;justify-content:space-between;gap:12px}.data-labels{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;background:#f8f6fb;padding:12px;border-radius:9px}.footer{color:#93899f;font-size:11px;margin-top:25px}.empty{padding:24px;color:#93899f}#nav-toggle>summary{display:none}.notice{background:#fff8e1;color:#8b6b29;padding:10px 16px;font-size:12px;text-align:center;border-bottom:1px solid #f0e5c5}.source{margin-top:20px;font-size:11px;color:#958a9e;overflow-wrap:anywhere}.kicker{font-size:12px;color:#9f8bb8}
@media(max-width:1150px){.layout{grid-template-columns:195px minmax(0,1fr)}.notes-aside{grid-column:2}.notes{position:static}.notes textarea{min-height:110px}header{padding:20px 24px}}
@media(max-width:720px){header{padding:18px 20px;align-items:flex-start}.brand{font-size:21px}.header-meta{max-width:140px;font-size:11px}.layout{display:block;padding:18px 16px}.navigation{position:static;margin-bottom:22px}#nav-toggle{border:1px solid #e5dfef;border-radius:12px;background:#fff;padding:12px}#nav-toggle>summary{display:block}.search{margin-top:12px}#nav-list{max-height:330px}.cols{grid-template-columns:1fr;gap:0}h1{font-size:23px}.card{padding:17px}.tabs button{padding:10px 12px;font-size:13px}.notes{margin-top:20px}.notice{text-align:left;padding:10px 20px}}
</style>
<header><div class="brand">Care Kotoba<small>内容审稿 · REVIEW DESK</small></div><div class="header-meta"><span class="pill draft">待专业审稿</span><div id="corpus-counts">场景 · 术语 · 评测草稿</div></div></header>
<div class="notice">所有案例均为虚构。这里记录审阅意见，不替代介护经验者与日语教育者的正式审稿。</div>
<div class="layout">
<aside><div class="navigation"><details id="nav-toggle" open><summary>选择场景 <span class="note-count count" id="scene-count"></span></summary><label class="muted" for="search">搜索场景与内容</label><input id="search" class="search" type="search" placeholder="例如：拒绝、報告、更衣"><div id="nav-list"></div></details><p class="footer">先看学习目标与已给信息，再核对例句、术语和反馈依据。</p></div></aside>
<main id="main"><div id="scene-heading"></div><div class="tabs" role="tablist" aria-label="审稿内容"><button type="button" role="tab" id="tab-scene" aria-controls="panel-scene" aria-selected="true" data-tab="scene">对话规格</button><button type="button" role="tab" id="tab-terms" aria-controls="panel-terms" aria-selected="false" data-tab="terms">相关术语</button><button type="button" role="tab" id="tab-evals" aria-controls="panel-evals" aria-selected="false" data-tab="evals">评测片段</button></div><section id="panel-scene" class="panel active" role="tabpanel" aria-labelledby="tab-scene"></section><section id="panel-terms" class="panel" role="tabpanel" aria-labelledby="tab-terms"></section><section id="panel-evals" class="panel" role="tabpanel" aria-labelledby="tab-evals"></section></main>
<aside class="notes-aside"><div class="notes"><h2>这条场景的审阅意见</h2><p class="muted">建议会保留在本机，也可以导出给其他审稿者。</p><label for="recommendation">处理建议</label><select id="recommendation"><option value="unmarked">暂未标记</option><option value="revise">建议修改</option><option value="keep_as_draft">建议保留为草稿</option></select><label for="review-note">具体意见</label><textarea id="review-note" placeholder="例如：哪句日语需要调整？哪些信息还没有给学员？请只写虚构案例的审阅意见。"></textarea><div id="save-status" class="status" role="status" aria-live="polite"></div><button class="primary" id="export" type="button">导出全部审阅意见</button><p class="muted">导出不会改动场景、标签或正式审批状态。</p><div id="source-info" class="source"></div></div></aside>
</div>
<script id="ck-data" type="application/json">__CARE_KOTOBA_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('ck-data').textContent);
const $=id=>document.getElementById(id);
const storageKey='ck-review-notes-v1-'+data.source_digest;
$('corpus-counts').textContent=data.scenarios.length+' 场景 · '+data.terms.length+' 术语 · '+(data.evals.length+data.pairs.length)+' 评测草稿';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const skills={clarification:'主动问清',refusal_respect:'尊重拒绝',report_certainty:'区分已知与未确认'};
const labels={met:'达到目标',missed:'明确遗漏',uncertain:'先确认转写',not_applicable:'不适用'};
const knownIds=new Set(data.scenarios.map(s=>s.id));
let current=data.scenarios[0].id, tab='scene', notes=new Map(), storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))for(const entry of saved){if(Array.isArray(entry)&&knownIds.has(entry[0])&&entry[1]&&typeof entry[1].note==='string')notes.set(entry[0],{note:entry[1].note.slice(0,20000),recommendation:['unmarked','revise','keep_as_draft'].includes(entry[1].recommendation)?entry[1].recommendation:'unmarked'});}}catch{storageAvailable=false;}
function list(items){return '<ul class="small-list">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}
function card(title,body,cls=''){return '<article class="card '+cls+'"><h2>'+esc(title)+'</h2>'+body+'</article>';}
function oldScore(e){return '<h3>语言目标的草稿判断</h3>'+list(Object.entries(e.labels).map(([k,v])=>(skills[k]||k)+'：'+(labels[v]||v)))+'<h3>可以引用的学员原话</h3>'+list(e.feedback_evidence.map(x=>x.quote))+'<h3>下一步</h3><p>'+esc(e.next_step_zh)+'</p><h3>不可推定的内容</h3>'+list(e.must_not_claim_zh);}
function pairScore(e){const names={quote_attribution:'原话引用',source_and_verification:'来源与核实状态',bounded_inference:'推断范围',respect_refusal:'尊重拒绝',transcript_uncertainty:'转写不确定'};const values={pass:'符合此项',fail:'需要修正',not_applicable:'此片段不评价'};return '<h3>候选反馈的草稿判断</h3><p>'+(e.acceptable?'可接受':'需要修正')+' · '+esc(e.reason_zh)+'</p>'+list(Object.entries(e.gates).map(([k,v])=>names[k]+'：'+values[v]))+'<h3>可靠的学员原话依据</h3>'+(e.feedback_evidence.length?list(e.feedback_evidence.map(x=>x.quote_ja)):'<p>关键转写不足，先确认，不提供硬评分引文。</p>');}
function selectScene(id){if(!knownIds.has(id))return;current=id;render();if(matchMedia('(max-width:720px)').matches)$('nav-toggle').open=false;}
function renderNav(){const query=$('search').value.trim().toLowerCase();const scenes=data.scenarios.filter(s=>(s.id+' '+JSON.stringify(s)+' '+(skills[s.primary_skill]||'')).toLowerCase().includes(query));$('scene-count').textContent=scenes.length+' / '+data.scenarios.length;let last='';$('nav-list').innerHTML=scenes.map(s=>{const group=skills[s.primary_skill]||s.primary_skill;const heading=last!==group?'<div class="nav-group">'+esc(group)+'</div>':'';last=group;return heading+'<button type="button" class="scene-button" data-scene="'+esc(s.id)+'" aria-current="'+(s.id===current)+'"><span><span class="scene-id">'+esc(s.id)+'</span>'+esc(s.title_ja)+'</span></button>';}).join('')||'<div class="empty">没有匹配的场景</div>';document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>selectScene(b.dataset.scene));}
function render(){const s=data.scenarios.find(x=>x.id===current);renderNav();$('scene-heading').innerHTML='<div class="scene-top"><span class="eyebrow">'+esc(s.id)+' · '+esc(s.version)+'</span><span class="pill">'+esc(skills[s.primary_skill]||s.primary_skill)+'</span></div><h1 class="jp">'+esc(s.title_ja)+'</h1><div class="muted">'+esc(s.setting_ja)+' · 对话角色：'+esc(s.npc_role_ja)+'</div>';
const good=s.examples.map(x=>'<div class="example jp">'+esc(x.learner_ja)+'</div><p class="muted">'+esc(x.why_acceptable_zh)+'</p>').join('');
const counter=s.counterexamples.map(x=>'<div class="example jp">'+esc(x.learner_ja)+'</div><p class="muted jp">'+esc(x.why_problematic_ja)+'</p>').join('');
$('panel-scene').innerHTML=card('角色开场','<div class="jp">'+esc(s.opening_ja)+'</div>','opening')+card('这次要练什么',list(s.learning_objectives_ja))+'<div class="cols">'+card('学员已知的信息',list(s.learner_known_ja))+card('隐藏信息 · 仅供审稿','<details><summary>展开角色未揭示的信息</summary><p class="muted">未揭示前，不应把它当作学员必须知道的答案。</p>'+list(s.hidden_information.map(x=>x.id+' · '+x.fact_ja))+'</details>','hidden-info')+'</div>'+card('对话分支',s.conversation_branches.map(b=>'<details class="branch"><summary>'+esc(b.id)+' · '+esc(b.trigger_zh)+'</summary><div class="example jp">'+esc(b.npc_reply_ja)+'</div><p>'+esc(b.coach_rule_zh)+'</p><span class="tag">揭示：'+esc(b.reveals.join('、')||'无')+'</span></details>').join(''))+'<div class="cols">'+card('可接受的表达例子',good,'good')+card('反例 · 不作为推荐回应',counter,'counter')+'</div>'+card('反馈规则',list(s.feedback_rules_zh))+card('迁移练习','<p class="jp">'+esc(s.transfer_task.prompt_ja)+'</p>'+list(s.transfer_task.expected_intents_ja));
function termRuby(t){
 if(!/[一-龯々]/.test(t.ja))return esc(t.ja);
 const suffix=t.ja.match(/[ァ-ヺー・]+$/)?.[0]||'';
 if(suffix&&t.reading_ja.endsWith(suffix))return '<ruby>'+esc(t.ja.slice(0,-suffix.length))+'<rt>'+esc(t.reading_ja.slice(0,-suffix.length))+'</rt></ruby>'+esc(suffix);
 return '<ruby>'+esc(t.ja)+'<rt>'+esc(t.reading_ja)+'</rt></ruby>';
}
const relevant=data.terms.filter(t=>t.scenario_ids.includes(current));$('panel-terms').innerHTML='<p class="muted">'+relevant.length+' 条关联术语。迁移候选不改变原场景的已知信息。</p>'+relevant.map(t=>card(t.placement==='core'?'本场景核心词':'仅供迁移练习','<span class="kicker">'+esc(t.id)+'</span><div class="term jp">'+termRuby(t)+'</div><p>'+esc(t.learning_gloss['zh-Hans'])+'</p><p class="muted">'+esc(t.learning_gloss.en)+'</p><div class="example jp">'+esc(t.example_ja)+'</div><p class="muted">审稿重点：'+esc(t.feedback_guard_zh)+'</p><span class="tag">'+(t.provenance.kind==='common_headword_reference'?'词形/读音参考教材 · 印刷页 '+esc(t.provenance.printed_entry_page)+' / PDF页 '+esc(t.provenance.pdf_entry_page):'项目沟通词条')+'</span>')).join('');
const samples=data.evals.filter(e=>e.scenario_id===current);const pairs=data.pairs.filter(e=>e.scenario_anchor===current);$('panel-evals').innerHTML='<p class="muted">本场景 '+samples.length+' 条固定转写样本 · '+pairs.length+' 条独立反馈评测片段。评分标签是待审稿草稿。</p>'+samples.map(e=>card(e.id,'<span class="tag">'+esc(e.case_type)+'</span>'+e.learner_transcript.map(t=>'<div class="example jp">'+esc(t.utterance_id)+' · '+esc(t.text_ja)+'</div>').join('')+'<details><summary>查看评分草稿与引用依据</summary><div class="data-labels">'+oldScore(e.expected)+'</div></details>')).join('')+pairs.map(e=>card(e.id+' · 独立反馈评测',list(e.facts.map(f=>f.text_ja))+'<h3>学员发话</h3><div class="example jp">'+esc(e.learner_turn.text_ja)+'</div><h3>待判断的反馈候选</h3><p class="jp">'+esc(e.candidate_feedback_ja)+'</p><details><summary>查看评分草稿 · 不作为模型输入</summary><div class="data-labels">'+pairScore(e.expected_feedback)+'</div></details>')).join('');
const note=notes.get(current)||{note:'',recommendation:'unmarked'};$('review-note').value=note.note;$('recommendation').value=note.recommendation;$('save-status').textContent=storageAvailable?(notes.has(current)?'已载入本机审阅记录':'尚未填写本条意见'):'本机保存不可用，请导出JSON保留意见';showTab(tab);}
function showTab(name){tab=name;document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===name;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+name));}
function save(){const note=$('review-note').value.slice(0,20000),recommendation=$('recommendation').value;if(!note.trim()&&recommendation==='unmarked')notes.delete(current);else notes.set(current,{note,recommendation});try{localStorage.setItem(storageKey,JSON.stringify([...notes]));storageAvailable=true;$('save-status').textContent='已在本机保存 · 不代表审批通过';}catch{storageAvailable=false;$('save-status').textContent='本机保存不可用，请导出JSON保留意见';}}
$('search').addEventListener('input',renderNav);$('review-note').addEventListener('input',save);$('recommendation').addEventListener('change',save);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const ids=['scene','terms','evals'];let i=ids.indexOf(tab);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;showTab(ids[i]);$('tab-'+ids[i]).focus();});
$('export').onclick=()=>{save();const report={format:'care-kotoba-review-notes',version:'0.1.0',created_at:new Date().toISOString(),source_digest:data.source_digest,source_files_sha256:data.source_files_sha256,formal_approval:false,notes:[...notes].map(([scenario_id,n])=>({scenario_id,...n}))};const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='Care-Kotoba-review-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('save-status').textContent='已导出审阅意见 · 正式内容未改动';};
$('source-info').textContent='资料版本 '+data.version+' · 来源指纹 '+data.source_digest.slice(0,12)+'。意见与本次资料快照关联。';
if(matchMedia('(max-width:720px)').matches)$('nav-toggle').open=false;
render();
</script>
</html>
